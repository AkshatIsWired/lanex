<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LanEx RTL IDE</title>
  <link rel="icon" type="image/png" href="/static/vendor/favicon.png" />
  <link rel="stylesheet" href="/static/fonts.css" />
  <link rel="stylesheet" href="/static/styles.css" />
  <link rel="stylesheet" href="/static/features.css" />
  <link rel="stylesheet" href="/static/ide.css" />
  <link rel="stylesheet" href="/static/shell.css" />
  <!-- PWA: installable standalone-window app (Chromium/Edge). Static manifest. -->
  <link rel="manifest" href="/static/manifest.json" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f7fb" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e1524" />
  <link rel="apple-touch-icon" href="/static/vendor/icon-192.png" />
  <!-- Lint/sim output and editor text must not be rewritten by auto-translate. -->
  <meta name="google" content="notranslate" />
</head>
<body class="ide-body theme-dark">
      <div class="ide-embed">
        <div class="ide-topbar">
          <strong>RTL IDE</strong>
          <span class="ide-design" id="ide-design">…</span>
          <span class="ide-spacer"></span>
          <span class="ide-note" id="ide-note" role="status"></span>
        </div>
        <div class="ide-grid">
          <!-- Explorer: the project's files by what they're for, like an FPGA
               tool's Sources view (design / simulation / constraints). -->
          <aside class="ide-side" aria-label="Project files">
            <div class="ide-side-head">
              <span class="ide-view-seg" role="tablist" aria-label="Explorer view"><button class="is-on" role="tab" aria-selected="true" data-view="files">Files</button><button role="tab" aria-selected="false" data-view="hier" title="The module hierarchy: the top and every instance under it">Hierarchy</button></span><span class="ide-spacer"></span>
              <button class="iconbtn iconbtn-sm" id="ide-new-file" aria-label="New file" title="New file"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
              <button class="iconbtn iconbtn-sm" id="ide-upload" aria-label="Add files from your computer" title="Add files from your computer"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4M7 8l5-5 5 5M5 20h14"/></svg></button>
            </div>
            <div id="ide-tree" class="ide-tree"></div>
          </aside>
          <div class="ide-center">
            <div class="ide-tabs" id="ide-tabs" role="tablist" aria-label="Open files"></div>
            <div class="ide-toolbar">
              <span id="ide-open" class="ide-open">No file open</span>
              <span id="ide-cursor" class="ide-cursor">Ln 1, Col 1</span>
              <span class="ide-spacer"></span>
              <button class="btn btn-ghost btn-sm" id="ide-find" title="Find and replace (Ctrl F)">Find</button>
              <button class="btn btn-ghost btn-sm" id="ide-save" title="Save (Ctrl S)">Save</button>
              <span class="tb-sep" aria-hidden="true"></span>
              <label class="ide-autolint" title="Run the syntax check each time you save a Verilog file"><input type="checkbox" id="ide-autolint"/> Check on save</label>
              <button class="btn btn-sm" id="ide-lint" title="Check every design and testbench file with Verilator">Check syntax</button>
              <span class="ide-simsplit">
                <button class="btn btn-primary btn-sm" id="ide-sim" title="Build and run the testbench, then show its waveform"><svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor" aria-hidden="true"><path d="M7 4l13 8-13 8z"/></svg> Simulate</button>
                <button class="btn btn-primary btn-sm ide-sim-pick" id="ide-sim-pick" aria-haspopup="menu" aria-expanded="false" title="Which testbench Simulate runs"><span id="ide-sim-tbname">no testbench</span><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
                <div class="ide-sim-menu" id="ide-sim-menu" role="menu" hidden></div>
              </span>
            </div>
            <div class="ide-editor-wrap">
              <div id="ide-editor" class="ide-editor"></div>
              <div class="ide-start" id="ide-start" hidden></div>
            </div>
            <div class="ide-split" id="ide-split" role="separator" aria-orientation="horizontal" aria-label="Resize the bottom panel" tabindex="0"></div>
            <div class="ide-panel" id="ide-panel">
              <div class="ide-panel-bar">
                <div class="ide-ptabs" role="tablist" aria-label="Output">
                  <button class="ide-ptab is-on" role="tab" data-ptab="problems">Problems <span class="pcount" id="ide-problems-count">not checked</span></button>
                  <button class="ide-ptab" role="tab" data-ptab="sim">Simulation <span class="pcount" id="ide-sim-count"></span></button>
                  <button class="ide-ptab" role="tab" data-ptab="wave">Waveform
                    <span id="ide-wave-partial" class="wave-partial" hidden title="The simulation hit its time limit before $finish, so this waveform is incomplete. Add $finish to the testbench to capture the whole run.">partial</span></button>
                </div>
                <span class="ide-spacer"></span>
                <button class="iconbtn iconbtn-sm" id="ide-panel-max" aria-pressed="false" aria-label="Give the panel the editor's space" title="Give the panel the editor's space (the file tabs stay)"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h16M4 4h16v16H4z"/></svg></button>
                <button class="iconbtn iconbtn-sm panel-fs-btn" data-fs-target="ide-panel" aria-label="Fullscreen panel" title="Fullscreen (Esc to leave)"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg></button>
                <button class="iconbtn iconbtn-sm" id="ide-panel-toggle" aria-label="Hide the panel" title="Hide or show the panel"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
              </div>
              <div class="ide-pane is-on" data-pane="problems" id="ide-problems">
                <div id="ide-diags" class="ide-diags"></div>
              </div>
              <div class="ide-pane" data-pane="sim">
                <div class="ide-sim-bar">
                  <label class="ide-field">Testbench <select id="ide-tb"></select></label>
                  <label class="ide-field">Top module <input id="ide-top" class="inp" type="text" placeholder="from the testbench" spellcheck="false" /></label>
                  <label class="ide-field">Simulator <select id="ide-sim-engine">
                    <option value="auto">Auto (Icarus if installed, else Verilator)</option>
                    <option value="iverilog">Icarus Verilog</option>
                    <option value="verilator">Verilator</option>
                  </select></label>
                  <button class="btn btn-ghost btn-sm" id="ide-sim-stop" hidden title="Stop the running simulation"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6h12v12H6z"/></svg> Stop</button>
                  <span class="ide-spacer"></span>
                  <button class="btn btn-ghost btn-sm" id="ide-log-clear" title="Clear the simulation output">Clear output</button>
                </div>
                <div class="ide-sim-status" id="ide-sim-status" hidden></div>
                <div id="ide-log" class="ide-log" role="log" aria-live="off"></div>
              </div>
              <div class="ide-pane" data-pane="wave">
                <div class="wv" id="ide-wave-host"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

  <script type="module" src="/static/modules/ide/main.js"></script>
</body>
</html>
