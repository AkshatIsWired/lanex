# Windows installer CI: build LanEx.exe + LanEx-Setup.exe, verify what CAN be
# verified here, and attach the installer to a tagged release.
#
# WHAT THIS WORKFLOW CANNOT DO, STATED PLAINLY: it cannot install LanEx.
# GitHub-hosted runners have no nested virtualization, so WSL 2 does not run on
# them — no `wsl --import`, no provisioning, no launch. Real install testing is
# manual, on VMs, against the matrix in windows/README.md. A green tick here
# means "the pieces build and their pure logic is correct", nothing more, and
# pretending otherwise would be worse than having no CI at all.
#
# So it verifies exactly the parts that are verifiable off-WSL:
#   * the launcher compiles for windows/amd64 and its unit tests pass — including
#     the UTF-16LE decoding of `wsl -l -q`, the classic silent bug that makes a
#     healthy install look missing;
#   * lanex.iss compiles (its Pascal is compiled by ISCC, so syntax and every
#     API name are checked);
#   * provision.sh passes `bash -n` and shellcheck, AND actually provisions a
#     plain ubuntu:24.04 container end to end, twice, with the appliance
#     self-test passing after each (provision-e2e). That covers the whole of
#     provisioning and the Repair path — everything except the two things that
#     need WSL: `wsl --import` and the first launch;
#   * the pinned Ubuntu rootfs URL still exists and still matches Microsoft's
#     published WSL image manifest (weekly — see the rootfs-pin job).
#
# On a tag it also BAKES the appliance (bake-rootfs): the same provision.sh,
# in a container, exported as the image Setup downloads. That is a build
# artifact, not a test — the baked image is still only verified as far as a
# container can verify it, and `wsl --import`ing it is a manual step in the
# matrix like everything else that needs WSL.
name: Windows installer

on:
  push:
    # windows-installer-support is the integration branch for this installer;
    # it carries changes that no other job in the repo covers, and waiting for a
    # PR to find out whether provisioning still works is too late. Drop it from
    # this list once it merges — every other branch gets the same coverage from
    # the pull_request trigger below.
    branches: [main, dev, windows-installer-support]
    tags: ["v*"]
  pull_request:
  schedule:
    # Weekly, for the rootfs pin: releases.ubuntu.com deletes a point release's
    # files when the next one ships, so a stale pin is a broken installer.
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Phase 2a. Cook the appliance ONCE, here, and let Setup download the result —
  # instead of every user's machine spending several minutes running apt, pip and
  # a Docker install that all have to be up at that moment.
  #
  # Tag builds and manual runs only. On a PR this would add ~20 minutes to prove
  # something provision-e2e already proves, and the asset it produces would have
  # no release to live in — so PR builds compile an installer with no baked
  # option at all, which is exactly how the installer shipped before this job.
  bake-rootfs:
    name: Bake the appliance rootfs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    outputs:
      # Empty when the bake produced nothing usable — `build` reads these and
      # simply omits the ISCC defines, so a failed bake degrades to the old
      # behaviour rather than shipping a URL that 404s.
      sha256: ${{ steps.bake.outputs.sha256 }}
      size-mb: ${{ steps.bake.outputs.size-mb }}
      url: ${{ steps.bake.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - name: Bake
        id: bake
        env:
          # The tag's own ref, so the image contains the LanEx the installer
          # built beside it claims to install. Self-consistency is the point:
          # see the release checklist in windows/README.md.
          LANEX_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          docker run -d --name lanex-bake \
            -v "$PWD/windows/provision:/lanex-provision:ro" \
            -e "LANEX_REF=$LANEX_REF" -e LANEX_BAKE=1 \
            ubuntu:24.04 sleep infinity
          docker exec lanex-bake bash /lanex-provision/provision.sh

          # Before export, never after: a broken appliance must not be able to
          # become a published release asset.
          docker exec lanex-bake bash /lanex-provision/selftest.sh

          # `wsl --import` reads gzipped tar directly. -6 rather than -9: the
          # last few percent cost minutes of CI for seconds of user download.
          docker export lanex-bake | gzip -6 > lanex-rootfs-amd64.tar.gz
          sha=$(sha256sum lanex-rootfs-amd64.tar.gz | cut -d' ' -f1)
          mb=$(( $(stat -c%s lanex-rootfs-amd64.tar.gz) / 1048576 ))
          {
            echo "sha256=$sha"
            echo "size-mb=$mb"
            echo "url=https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/lanex-rootfs-amd64.tar.gz"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Pre-baked appliance rootfs"
            echo "- ref: \`$LANEX_REF\`"
            echo "- size: ${mb} MB compressed"
            echo "- sha256: \`$sha\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: lanex-rootfs-amd64
          path: lanex-rootfs-amd64.tar.gz
          if-no-files-found: error

      # Must land BEFORE the installer that points at it — hence this job being
      # a dependency of `build` rather than running alongside it.
      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" lanex-rootfs-amd64.tar.gz --clobber

  build:
    name: Build LanEx.exe + LanEx-Setup.exe
    runs-on: windows-latest
    timeout-minutes: 30
    # bake-rootfs is skipped on every ordinary push and PR. `always()` keeps this
    # job running when it is skipped; the two result checks still stop a build
    # from shipping after a bake that actually broke.
    needs: bake-rootfs
    if: >
      always() && needs.bake-rootfs.result != 'failure'
      && needs.bake-rootfs.result != 'cancelled'
    permissions:
      # Needed only by the release step at the end (tag pushes).
      contents: write
    env:
      # Signing lights up on its own once the owner adds Azure Trusted Signing
      # secrets; until then the build is unsigned and the README documents the
      # SmartScreen "More info -> Run anyway" click. Secrets are unreadable in
      # `if:` conditions directly, hence this job-level flag.
      SIGN: ${{ secrets.AZURE_TENANT_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Matches the `go` directive in windows/launcher/go.mod. Pinned rather
          # than "stable" so a new Go release cannot change the produced binary
          # without a deliberate commit.
          go-version: "1.22"
          cache-dependency-path: windows/launcher/go.sum

      # A tag drives the version everywhere: the exe's VERSIONINFO resource, the
      # installer's AppVersion, and the uninstall entry in Windows Settings.
      # Untagged builds get 0.0.0 so nothing can masquerade as a release.
      - name: Resolve version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $ver = $env:GITHUB_REF -replace '^refs/tags/v', ''
          } else {
            $ver = '0.0.0'
          }
          # VERSIONINFO and Inno both want a plain numeric x.y.z, so strip any
          # pre-release suffix (v1.2.3-rc1 -> 1.2.3) for those fields.
          $num = ($ver -split '-')[0]
          $parts = $num -split '\.'
          while ($parts.Count -lt 3) { $parts += '0' }
          "LANEX_VERSION=$ver"            | Out-File -Append $env:GITHUB_ENV
          "LANEX_VERSION_NUM=$num"        | Out-File -Append $env:GITHUB_ENV
          "LANEX_VER_MAJOR=$($parts[0])"  | Out-File -Append $env:GITHUB_ENV
          "LANEX_VER_MINOR=$($parts[1])"  | Out-File -Append $env:GITHUB_ENV
          "LANEX_VER_PATCH=$($parts[2])"  | Out-File -Append $env:GITHUB_ENV
          Write-Host "version: $ver (numeric $num)"

      - name: go vet
        working-directory: windows/launcher
        run: go vet ./...

      - name: gofmt (formatting is not a matter of taste in CI)
        working-directory: windows/launcher
        shell: pwsh
        run: |
          $bad = gofmt -l .
          if ($bad) { Write-Error "gofmt would change: $bad"; exit 1 }
          Write-Host "gofmt clean"

      # The one piece of launcher logic that can be tested without WSL, and the
      # one that has historically been wrong in hand-written WSL launchers.
      - name: Launcher unit tests (UTF-16 distro parsing, health probe)
        working-directory: windows/launcher
        run: go test -v ./...

      # Icon + publisher + version + the asInvoker/dpiAware manifest. An exe with
      # none of these is what SmartScreen and AV heuristics flag, and our target
      # user is exactly the one who cannot get past a warning wall.
      - name: Embed icon, version info and manifest
        working-directory: windows/launcher
        run: |
          go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.7.0
          # -ver-* sets FixedFileInfo.FileVersion only; without the -product-ver-*
          # quartet FixedFileInfo.ProductVersion keeps versioninfo.json's local
          # fallback (1.0.0.0), so a v0.9.0 release would show "Product version
          # 1.0.0.0" in the exe's Properties -> Details tab.
          goversioninfo -64 -o resource.syso `
            -ver-major ${{ env.LANEX_VER_MAJOR }} `
            -ver-minor ${{ env.LANEX_VER_MINOR }} `
            -ver-patch ${{ env.LANEX_VER_PATCH }} `
            -ver-build 0 `
            -product-ver-major ${{ env.LANEX_VER_MAJOR }} `
            -product-ver-minor ${{ env.LANEX_VER_MINOR }} `
            -product-ver-patch ${{ env.LANEX_VER_PATCH }} `
            -product-ver-build 0 `
            -product-version "${{ env.LANEX_VERSION }}" `
            versioninfo.json
        shell: pwsh

      # -H windowsgui: no console window flashes when the user clicks the icon.
      # -s -w: strip symbols/DWARF — this is a 400-line launcher, not something
      # anyone debugs from a customer's machine.
      - name: Build LanEx.exe
        working-directory: windows/launcher
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-H windowsgui -s -w" -o LanEx.exe .

      # Signing the launcher BEFORE the installer packages it — otherwise the
      # signed installer would carry an unsigned payload, which is the half-fix
      # SmartScreen still punishes.
      - name: Sign LanEx.exe
        if: env.SIGN == 'true'
        uses: azure/trusted-signing-action@v0.5.1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder: windows/launcher
          files-folder-filter: exe

      # 6.3+ for ArchitecturesAllowed=x64compatible. ISCC compiles the [Code]
      # section too, so this step is a real check of the Pascal, not just packaging.
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile LanEx-Setup.exe
        working-directory: windows/installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $defines = @("/DAppVersion=${{ env.LANEX_VERSION_NUM }}")
          # Only a bake that ran AND produced a hash gets wired in. Anything else
          # compiles the installer exactly as it was before Phase 2a: it
          # downloads the pinned Ubuntu image and provisions on the user's
          # machine. No phantom URLs in PR builds.
          $baked = "${{ needs.bake-rootfs.outputs.sha256 }}"
          if ($baked) {
            $defines += "/DBakedRootfsUrl=${{ needs.bake-rootfs.outputs.url }}"
            $defines += "/DBakedRootfsSha256=$baked"
            $defines += "/DBakedRootfsSizeMB=${{ needs.bake-rootfs.outputs.size-mb }}"
            Write-Host "building WITH the pre-baked rootfs (${{ needs.bake-rootfs.outputs.size-mb }} MB)"
          } else {
            Write-Host "building without a pre-baked rootfs (provision runs on the user's machine)"
          }
          & $iscc /Qp @defines lanex.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem LanEx-Setup.exe

      - name: Sign LanEx-Setup.exe
        if: env.SIGN == 'true'
        uses: azure/trusted-signing-action@v0.5.1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder: windows/installer
          files-folder-filter: exe

      # The SHA256 belongs in the job summary: it is what a cautious user checks
      # against the release page before running an installer that asks for admin.
      - name: Summary
        if: always()
        shell: pwsh
        run: |
          $exe = "windows/installer/LanEx-Setup.exe"
          "## Windows installer" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          if (Test-Path $exe) {
            $f = Get-Item $exe
            $h = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
            "- version: ``${{ env.LANEX_VERSION }}``"                     | Out-File -Append $env:GITHUB_STEP_SUMMARY
            "- size: $([math]::Round($f.Length/1MB,2)) MB"                | Out-File -Append $env:GITHUB_STEP_SUMMARY
            "- sha256: ``$h``"                                            | Out-File -Append $env:GITHUB_STEP_SUMMARY
            "- signed: ${{ env.SIGN == 'true' }}"                         | Out-File -Append $env:GITHUB_STEP_SUMMARY
            $baked = "${{ needs.bake-rootfs.outputs.sha256 }}"
            if ($baked) {
              "- pre-baked rootfs: ${{ needs.bake-rootfs.outputs.size-mb }} MB, ``$baked``" | Out-File -Append $env:GITHUB_STEP_SUMMARY
            } else {
              "- pre-baked rootfs: none (Setup provisions on the user's machine)"          | Out-File -Append $env:GITHUB_STEP_SUMMARY
            }
          } else {
            "- **the installer did not build**" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          }
          ""                                                                    | Out-File -Append $env:GITHUB_STEP_SUMMARY
          "Not verified here (no nested virtualization on GitHub runners, so no" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          "WSL 2): the actual install, provisioning, and first launch. Those are" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          "tested by hand against the matrix in ``windows/README.md``."           | Out-File -Append $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: LanEx-Setup-${{ env.LANEX_VERSION }}
          path: windows/installer/LanEx-Setup.exe
          if-no-files-found: error

      # gh is preinstalled on the runner, so no third-party release Action is
      # needed. --clobber makes a re-run of a tag idempotent.
      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" `
            windows/installer/LanEx-Setup.exe --clobber

  provision-lint:
    name: provision.sh (bash -n + shellcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # provision.sh is the one component that runs unattended, as root, on a
      # stranger's machine. shellcheck at style level (not just error level)
      # because an unquoted expansion there is a broken install, not a nit.
      - name: Lint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          bash -n windows/provision/provision.sh
          shellcheck -S style windows/provision/provision.sh
          echo "provision.sh OK"

      # Line endings are load-bearing here: a CRLF provision.sh fails inside WSL
      # on its own shebang with "bad interpreter", which reads like the file is
      # missing. .gitattributes pins LF; this proves the pin is working.
      - name: No CRLF in shell scripts
        run: |
          if grep -rlU $'\r' --include='*.sh' --exclude-dir=.git . ; then
            echo "the files above contain CR — fix .gitattributes / re-checkout"; exit 1
          fi
          echo "all .sh files are LF — OK"

  provision-e2e:
    name: provision.sh end-to-end (container)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # Which ref's scripts/install.sh should the appliance install? The one
      # being built — otherwise a green tick would only prove that `main` still
      # works. head_ref is the PR's source branch; ref_name covers pushes and
      # tags. A fork PR's head_ref does not exist in THIS repo, so the URL is
      # probed and falls back to the base branch rather than 404-ing four
      # minutes into the run.
      - name: Resolve the ref to provision from
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.ref || github.ref_name }}"
          for ref in "${{ github.head_ref }}" "${{ github.ref_name }}" "$base" main; do
            [ -n "$ref" ] || continue
            url="https://raw.githubusercontent.com/${{ github.repository }}/$ref/scripts/install.sh"
            if curl -fsI --max-time 30 "$url" >/dev/null 2>&1; then
              echo "provisioning from ref: $ref"
              echo "LANEX_REF=$ref" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "not fetchable: $ref"
          done
          echo "::error::no usable ref for scripts/install.sh"; exit 1

      # A plain ubuntu:24.04 base, not the WSL image: provision.sh is written to
      # run in both (see its header, rule 4) and the minimal one is the honest
      # test — every "Ubuntu already ships this" assumption fails here first.
      # That is not hypothetical: it is how the curl-before-apt and the
      # sudoers-before-sudo bugs were caught.
      - name: Provision a container
        run: |
          set -euo pipefail
          docker run -d --name lanex-e2e \
            -v "$PWD/windows/provision:/lanex-provision:ro" \
            -e "LANEX_REF=$LANEX_REF" \
            ubuntu:24.04 sleep infinity
          start=$(date +%s)
          docker exec lanex-e2e bash /lanex-provision/provision.sh
          echo "first run: $(( $(date +%s) - start ))s" >> "$GITHUB_STEP_SUMMARY"

      - name: Self-test the provisioned appliance
        run: docker exec lanex-e2e bash /lanex-provision/selftest.sh

      # The installer's Repair button and a re-run of Setup both re-execute this
      # script over a working appliance. A second run that is slow is a warning;
      # a second run that FAILS means Repair is broken for every user who ever
      # needs it, and nothing else in CI would notice.
      - name: Idempotency — the Repair path
        run: |
          set -euo pipefail
          start=$(date +%s)
          docker exec lanex-e2e bash /lanex-provision/provision.sh | tee repair.log
          took=$(( $(date +%s) - start ))
          echo "repair run: ${took}s" >> "$GITHUB_STEP_SUMMARY"
          grep -q "already exists" repair.log || { echo "::error::repair re-created the user"; exit 1; }
          grep -q "already installed" repair.log || { echo "::error::repair re-installed Docker"; exit 1; }
          docker exec lanex-e2e bash /lanex-provision/selftest.sh

      # Sizes the Phase 2a rootfs bake, and a sudden jump is the cheapest
      # possible signal that a dependency started dragging half of Ubuntu in.
      - name: Measure the appliance
        if: always()
        run: |
          bytes=$(docker export lanex-e2e | wc -c)
          echo "- provisioned rootfs: $(( bytes / 1024 / 1024 )) MiB uncompressed" \
            >> "$GITHUB_STEP_SUMMARY"

  rootfs-pin:
    name: Ubuntu rootfs pin still valid
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Not on ordinary pushes/PRs: upstream shipping a new point release is not a
    # reason to block somebody's unrelated pull request. It IS a reason to block
    # a release, so tags are included.
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      # Two independent failures, both of which break the installer for every
      # new user, silently, and neither of which any other job would notice:
      #
      #   1. The pinned URL 404s. releases.ubuntu.com DELETES a point release's
      #      files when the next one ships, so this is a matter of when, not if.
      #   2. Microsoft's WSL manifest now points at a newer image. That is the
      #      early warning for (1) — usually days ahead of the deletion.
      #
      # The fix for either is a one-line change to the #define block in
      # windows/installer/lanex.iss, which is why this job prints the exact new
      # values instead of just going red.
      - name: Check the pin against Microsoft's WSL image manifest
        run: |
          set -euo pipefail
          iss=windows/installer/lanex.iss
          pin_url=$(sed -n 's/^#define RootfsUrl *"\(.*\)".*/\1/p' "$iss")
          pin_sha=$(sed -n 's/^#define RootfsSha256 *"\(.*\)".*/\1/p' "$iss")
          echo "pinned: $pin_url"
          echo "        $pin_sha"
          test -n "$pin_url" && test -n "$pin_sha"

          echo "::group::pinned URL reachable?"
          code=$(curl -o /dev/null -sIL -w '%{http_code}' --max-time 60 "$pin_url")
          echo "HTTP $code"
          echo "::endgroup::"

          curl -fsSL --max-time 60 -o distros.json \
            https://raw.githubusercontent.com/microsoft/WSL/master/distributions/DistributionInfo.json
          up_line=$(python3 -c "import json; d=json.load(open('distros.json')); print(next(e['Amd64Url']['Url'] + ' ' + e['Amd64Url']['Sha256'] for e in d['ModernDistributions']['Ubuntu'] if e['Name'] == 'Ubuntu-24.04'))")
          up_url=${up_line%% *}
          up_sha=${up_line##* }
          echo "upstream: $up_url"
          echo "          $up_sha"

          fail=0
          if [ "$code" != "200" ]; then
            echo "::error::the pinned Ubuntu image is gone (HTTP $code). Update RootfsUrl/RootfsSha256/RootfsFile in $iss to: $up_url ($up_sha)"
            fail=1
          fi
          if [ "$pin_url" != "$up_url" ] || [ "$pin_sha" != "$up_sha" ]; then
            echo "::error::Ubuntu shipped a newer 24.04 image. Update $iss to: $up_url ($up_sha) — and set RootfsFile to ${up_url##*/}"
            fail=1
          fi
          if [ "$fail" = "0" ]; then
            echo "pin matches upstream and is reachable — OK"
          fi
          {
            echo "## Ubuntu rootfs pin"
            echo "- pinned: \`$pin_url\` (HTTP $code)"
            echo "- upstream: \`$up_url\`"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$fail"
